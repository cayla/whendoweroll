{% if players %}
<div class="overflow-x-auto rounded-lg border border-line mb-6">
  <table id="player-list" class="w-full border-collapse text-sm">
    <caption class="sr-only">Players in this campaign</caption>
    <thead>
      <tr class="border-b border-line bg-elevated text-left text-xs font-medium uppercase tracking-wide text-muted">
        <th scope="col" class="py-2.5 pl-3 pr-2 font-medium">Player</th>
        <th scope="col" class="py-2.5 pr-3 pl-2 text-right font-medium">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for player in players %}
      <tr class="border-b border-line last:border-b-0">
        <th scope="row" class="py-2.5 pl-3 pr-2 align-middle text-left font-medium text-ink">{{ player.display_name }}</th>
        <td class="py-2.5 pr-3 pl-2 align-middle text-right whitespace-nowrap">
          <span class="inline-flex flex-wrap items-center justify-end gap-2">
            <form method="post" action="{{ admin_url }}/players/{{ player.id }}/regenerate"
                  hx-post="{{ admin_url }}/players/{{ player.id }}/regenerate"
                  hx-target="#new-player-info" hx-swap="innerHTML">
              <button class="text-xs rounded border border-line px-2 py-1 hover:bg-elevated text-ink">
                Regenerate link
              </button>
            </form>
            <form method="post" action="{{ admin_url }}/players/{{ player.id }}/delete"
                  hx-post="{{ admin_url }}/players/{{ player.id }}/delete"
                  hx-swap="none">
              <button type="button"
                      class="text-xs rounded border border-line px-2 py-1 hover:bg-elevated text-ink"
                      data-admin-confirm
                      data-confirm-title="Delete player?"
                      data-confirm-body="Remove {{ player.display_name }} and their availability? This cannot be undone.">
                Delete
              </button>
            </form>
          </span>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<p class="mb-6 text-muted italic text-sm">No players yet.</p>
{% endif %}
