<div id="opt-outs-unified" class="overflow-hidden rounded-md border border-line">
  <table class="player-exceptions-table w-full text-xs border-collapse">
    <thead class="bg-elevated text-left text-muted uppercase tracking-wide">
      <tr>
        <th class="py-2 px-3 align-middle font-medium">When</th>
        <th class="py-2 px-3 align-middle font-medium">Conflict</th>
      </tr>
    </thead>
    <tbody>
      {% for row in unified_rows %}
      <tr class="border-t border-line">
        <td class="py-2 pl-3 pr-2 align-middle">
          <div class="whitespace-nowrap text-ink">{{ row.occ.starts_at_utc|local_time(display_tz) }}</div>
          {% if row.slot.label %}<div class="text-muted mt-0.5 normal-case tracking-normal">{{ row.slot.label }}</div>{% endif %}
          <div class="text-muted mt-0.5 normal-case tracking-normal">({{ row.can_make }}/{{ row.roster_n }} can make it)</div>
        </td>
        <td class="py-2 pr-3 pl-2 align-middle">
          <form hx-post="/c/{{ campaign.public_id }}/p/{{ token }}/opt-out"
                hx-target="#player-exceptions-below-toolbar"
                hx-swap="innerHTML"
                class="inline">
            <input type="hidden" name="slot_id" value="{{ row.slot.id }}">
            <input type="hidden" name="occurrence_start" value="{{ row.start_iso }}">
            {% if row.busy %}
            <input type="hidden" name="busy" value="0">
            <button type="submit" class="rounded border border-emerald-400 px-2 py-1 text-emerald-800 hover:bg-emerald-50 dark:border-emerald-700 dark:text-emerald-300 dark:hover:bg-emerald-950/40">
              Remove conflict
            </button>
            {% else %}
            <input type="hidden" name="busy" value="1">
            <button type="submit" class="rounded border border-amber-400 px-2 py-1 text-amber-900 hover:bg-amber-50 dark:border-amber-600 dark:text-amber-200 dark:hover:bg-amber-950/40">
              Can't make it
            </button>
            {% endif %}
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
