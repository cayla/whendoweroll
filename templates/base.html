<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}D&D Scheduler{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .heading { font-family: 'Cinzel', serif; letter-spacing: 0.02em; }
  .btn { @apply inline-flex items-center justify-center rounded-md border px-3 py-1.5 text-sm font-medium transition; }
</style>
</head>
<body class="min-h-screen bg-stone-100 text-stone-900">
<header class="border-b border-stone-300 bg-white/80 backdrop-blur sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3 min-w-0">
    <a href="/" class="heading text-xl text-red-800 hover:text-red-900 shrink-0">D&amp;D Scheduler</a>
    <div class="flex items-center justify-end gap-2 min-w-0 text-right">
      {% block header_right %}
      <span class="text-xs text-stone-500 truncate max-w-[min(72vw,28rem)]">{% block subtitle %}{% endblock %}</span>
      {% endblock %}
    </div>
  </div>
</header>
<main class="max-w-5xl mx-auto px-4 py-8">
  {% block content %}{% endblock %}
</main>
<footer class="max-w-5xl mx-auto px-4 py-6 text-xs text-stone-500">
  No accounts. URLs are the keys &mdash; share player links privately.
</footer>
</body>
</html>
