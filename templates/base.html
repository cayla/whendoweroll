<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="{{ url_for('static', path='js/theme-init.js') }}"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}When Do We Roll{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="{{ url_for('static', path='js/tailwind-config.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Germania+One&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body class="min-h-screen bg-canvas text-ink antialiased">
<header class="border-b border-line bg-[color:var(--color-header-bg)] backdrop-blur sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3 min-w-0">
    <a href="/" class="site-logo text-3xl text-brand-fg hover:text-brand-fg-hover shrink-0 transition-colors">When Do We Roll</a>
    <div class="flex items-center justify-end gap-2 min-w-0 text-right">
      <div class="flex items-center gap-2 shrink-0">
        <label for="theme-select" class="sr-only">Color theme</label>
        <select id="theme-select" name="theme"
                class="max-w-[10rem] rounded-md border border-line text-xs font-medium text-ink shadow-sm focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand"
                title="Light, dark, or match system setting"
                aria-describedby="theme-select-hint">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="system">Auto</option>
        </select>
        <span id="theme-select-hint" class="sr-only">Auto follows your device light or dark mode.</span>
      </div>
      {% block header_right %}
      <span class="text-xs text-muted truncate max-w-[min(72vw,28rem)]">{% block subtitle %}{% endblock %}</span>
      {% endblock %}
    </div>
  </div>
</header>
<main class="max-w-5xl mx-auto px-4 py-8">
  {% block content %}{% endblock %}
</main>
<footer class="max-w-5xl mx-auto px-4 py-6 text-xs text-muted text-center">
  No accounts. URLs are the keys &mdash; share player links privately.
</footer>
<script src="{{ url_for('static', path='js/theme-ui.js') }}"></script>
</body>
</html>
