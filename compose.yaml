---
services:
  # Run: docker compose --profile test run --build --rm test
  # (--build avoids a stale tag if this image name was previously used for another stage.)
  test:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: whendoweroll:test-runner
    working_dir: /app
    volumes:
      - .:/app
      # Anonymous volume shields the image's Linux .venv from the host bind
      # mount above (host .venv is macOS-built and unusable in the container).
      - /app/.venv
    command: ["pytest"]

  # Local dev: live code from the repo + --reload. DB stays on the named volume at /data
  # (bind mount is only /app, so it does not shadow whendoweroll_data).
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    working_dir: /app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    ports:
      - "8000:8000"
    environment:
      WHENDOWEROLL_DB_URL: sqlite:////data/whendoweroll.sqlite3
      # WHENDOWEROLL_DISABLE_NEW_CAMPAIGNS: "1"  # set to block POST / (new campaigns only)
    volumes:
      - .:/app
      # Keep the image's Linux .venv; host bind mount would replace it with an unusable tree.
      - /app/.venv
      - whendoweroll_data:/data

volumes:
  whendoweroll_data:
