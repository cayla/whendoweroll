[project]
name = "whendoweroll"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "sqlmodel",
    "python-multipart",
    "itsdangerous",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.ruff]
line-length = 119

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are intended to be called in argument
# defaults; treat them as immutable so B008 doesn't flag every route handler.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
]
[tool.uv]
package = false
