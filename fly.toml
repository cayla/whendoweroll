# Fly.io Machines — https://fly.io/docs/reference/configuration/
# Set `app` to a globally unique name (or run `fly launch` and merge changes).
app = "dnd-scheduler"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# SQLite persistence — create once before first deploy:
#   fly volumes create dnd_data --region iad --size 1
# Use the same region as `primary_region`.
[[mounts]]
  source = "dnd_data"
  destination = "/data"
