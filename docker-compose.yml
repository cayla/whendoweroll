services:
  # Run: docker compose --profile test run --build --rm test
  # (--build avoids a stale tag if this image name was previously used for another stage.)
  test:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: dnd-scheduler:test-runner
    working_dir: /app
    volumes:
      - .:/app
    command: ["pytest"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    environment:
      DND_SCHEDULER_DB_URL: sqlite:////data/dnd_scheduler.sqlite3
      # DND_SCHEDULER_DISABLE_NEW_CAMPAIGNS: "1"  # set to block POST / (new campaigns only)
    volumes:
      - dnd_data:/data

volumes:
  dnd_data:
